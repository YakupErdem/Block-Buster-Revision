<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --primary: #3d3d4b;
            --background-light: #f2ebd9;
            --border-retro: #2d2822;
            --button-shadow: #1a1a1a;
            --button-highlight: rgba(255, 255, 255, 0.15);
            --sidebar-width: 160px;
        }
        html, body {
            padding: 0px;
            margin: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            image-rendering: pixelated;
            touch-action: none;
        }
        /* Full Screen Wrapper - JS will scale this fixed 1280x720 box to fit any screen */
        #app {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1280px;
            height: 720px;
            background: #000;
            overflow: hidden;
            display: block;
            transform-origin: center center;
            /* Improved hit-testing for rotated elements on mobile */
            transform-style: preserve-3d;
            backface-visibility: hidden;
            pointer-events: auto;
        }

        #game-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #2e2e38 0%, #050505 100%);
        }

        #ui-layer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background-color: white;
            border-left: 4px solid var(--border-retro);
            display: none; 
            flex-direction: column;
            z-index: 10;
            pointer-events: auto;
            box-shadow: -4px 0 0 0 rgba(0,0,0,0.1);
        }

        .pixel-card {
            background: #ffffff;
            border: 4px solid var(--border-retro);
            position: relative;
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,0.1);
        }

        .ui-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: var(--primary);
            border: 4px solid var(--button-shadow);
            position: relative;
            cursor: pointer;
            transition: none;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            text-transform: uppercase;
            padding: 4px;
            width: 90%;
            min-height: 50px;
        }

        .ui-button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-top: 4px solid var(--button-highlight);
            border-left: 4px solid var(--button-highlight);
            border-bottom: 4px solid rgba(0,0,0,0.3);
            border-right: 4px solid rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .ui-button:hover {
            background-color: #4e4e5e;
            transform: translateY(-2px);
            box-shadow: 0 4px 0px 0px var(--button-shadow);
        }

        .ui-button:active {
            background-color: #2a2a35;
            transform: translateY(4px);
            box-shadow: none;
        }

        .section-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: var(--border-retro);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-stats-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 4px solid var(--border-retro);
            background-color: #f2ebd9;
            width: 90%;
            align-self: center;
        }

        #hud-money, #hud-level {
            font-size: 8px;
            text-align: center;
            width: 100%;
            font-family: 'Press Start 2P', cursive;
            color: black;
        }

        #settings-wrapper {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 50;
            pointer-events: auto;
        }

        #upgrades-scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 2rem;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="/style.css">
    <title>Block Buster!</title>
</head>

<body>
    <div style="font-family: 'Press Start 2P'; padding: 0; margin: 0; position: absolute; visibility: hidden;">.</div>
    <div id="app">
        <div id="game-container">
            <!-- Settings Button -->
            <div id="settings-wrapper">
                <button id="btn-settings" class="ui-button !w-12 !h-12 !min-h-0 bg-gray-700 text-xl">
                    ⚙️
                </button>
            </div>
        </div>

        <!-- Main Menu UI Layer (HTML) -->
        <div id="menu-layer"
            class="absolute inset-0 z-20 flex flex-col items-center justify-center space-y-16 pointer-events-none hidden bg-black/20">
            <div id="menu-title"
                class="font-['Press_Start_2P'] text-white text-5xl md:text-7xl text-center leading-tight drop-shadow-[10px_10px_0_rgba(0,0,0,1)] transition-all duration-500">
                BLOCK<br>BUSTER
            </div>
            <button id="btn-play"
                class="ui-button !w-72 !h-24 !text-2xl !min-h-0 !bg-white !text-black !border-black pointer-events-auto shadow-[8px_8px_0_rgba(0,0,0,0.3)] hover:!bg-gray-200 transition-transform active:scale-95">
                PLAY
            </button>
        </div>

        <!-- UI Sidebar -->
        <div id="ui-layer">
            <div class="hud-stats-container">
                <div id="hud-money">MONEY: $0</div>
                <div id="hud-level">LEVEL: 1</div>
            </div>

            <div id="upgrades-scroll-area">
                <button id="btn-damage" class="ui-button opacity-50 grayscale pointer-events-none">
                    <span class="text-[8px] mb-1 text-white">DAMAGE</span>
                    <span class="text-[10px] text-yellow-300">$100</span>
                </button>

                <button id="btn-balls" class="ui-button opacity-50 grayscale pointer-events-none">
                    <span class="text-[8px] mb-1 text-white">BALLS</span>
                    <span class="text-[10px] text-yellow-300">$50</span>
                </button>

                <button id="btn-duplicate" class="ui-button opacity-50 grayscale pointer-events-none">
                    <span class="text-[8px] mb-1 text-white">DUPLICATE</span>
                    <span class="text-[10px] text-purple-300">$200</span>
                </button>

                <button id="btn-laser" class="ui-button opacity-50 grayscale pointer-events-none">
                    <span class="text-[8px] mb-1 text-white">LASER</span>
                    <span class="text-[10px] text-red-300">$200</span>
                </button>

                <button id="btn-burst" class="ui-button opacity-50 grayscale pointer-events-none">
                    <span class="text-[8px] mb-1 text-white">BURST</span>
                    <span class="text-[10px] text-red-300">$100</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modals (Global) -->
    <div id="modal-settings" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center">
        <div class="pixel-card p-8 flex flex-col space-y-6 min-w-[300px]">
            <div class="section-label text-center text-lg">SETTINGS</div>
            <div class="flex justify-between items-center text-black font-['Press_Start_2P'] text-[10px]">
                <span>MUSIC</span>
                <input type="checkbox" id="toggle-music" class="w-6 h-6 border-4 border-black" />
            </div>
            <div class="flex justify-between items-center text-black font-['Press_Start_2P'] text-[10px]">
                <span>FX</span>
                <input type="checkbox" id="toggle-fx" class="w-6 h-6 border-4 border-black" />
            </div>
            <div class="flex justify-between items-center text-black font-['Press_Start_2P'] text-[10px]">
                <span>HAPTICS</span>
                <input type="checkbox" id="toggle-haptics" class="w-6 h-6 border-4 border-black" />
            </div>
            <button id="btn-close-settings" class="ui-button !w-full !h-12 !min-h-0">CLOSE</button>
        </div>
    </div>

    <div id="modal-gameover" class="hidden fixed inset-0 bg-red-900/80 z-[100] flex items-center justify-center">
        <div class="pixel-card p-8 flex flex-col space-y-6 min-w-[300px] items-center text-center">
            <div class="section-label text-xl text-red-600">GAME OVER</div>
            <div class="font-['Press_Start_2P'] text-[10px] text-black">SCORE</div>
            <div id="final-score" class="font-['Press_Start_2P'] text-lg text-black">0</div>
            <button id="btn-restart" class="ui-button !w-full !h-12 !min-h-0">RESTART</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
